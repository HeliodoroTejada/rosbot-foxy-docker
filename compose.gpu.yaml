# Optional Intel/AMD render node. Keep the standard Compose file portable.
# HOST_RENDER_GID=$(stat -c %g /dev/dri/renderD128) docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
services:
  ubuntu20:
    devices:
      - ${HOST_RENDER_DEVICE:-/dev/dri/renderD128}:/dev/dri/renderD128
    group_add:
      - "${HOST_RENDER_GID:?Set HOST_RENDER_GID to the render device group ID}"
    environment:
      LIBGL_ALWAYS_SOFTWARE: "0"
      MESA_LOADER_DRIVER_OVERRIDE: "${MESA_LOADER_DRIVER_OVERRIDE:-}"
