services:
  ubuntu20:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}

    image: rosbot-foxy-docker:foxy
    container_name: ubuntu20_foxy
    hostname: ubuntu20-foxy

    network_mode: host

    # Con red host, Docker no añade automáticamente el hostname a /etc/hosts.
    extra_hosts:
      - "ubuntu20-foxy:127.0.0.1"

    stdin_open: true
    tty: true
    init: true

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=${LIBGL_ALWAYS_SOFTWARE:-1}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-1}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}

    volumes:
      - ./carpeta_compartida:/home/user/carpeta_compartida
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    working_dir: /home/user/carpeta_compartida

    command: sleep infinity
